# airSpring workspace — WORKSPACE_DEPENDENCY_STANDARD compliant.
# Single Cargo.lock, shared deps, shared lints.

[workspace]
resolver = "3"
members = [
    "barracuda",
    "metalForge/forge",
    "experiments/exp001_local_science_parity",
    "experiments/exp002_composition_parity",
    "experiments/exp003_foundation_target_validation",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
authors = ["Squirrel Team"]
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
# Internal crates
airspring-barracuda = { path = "barracuda" }

# External ecosystem crates (path deps into sibling primals)
barracuda = { version = "0.4.0", path = "../../primals/barraCuda/crates/barracuda", default-features = false }
bingocube-nautilus = { version = "0.1.0", path = "../../primals/bingoCube/nautilus" }
akida-driver = { path = "../../primals/toadStool/crates/neuromorphic/akida-driver" }
primalspring = { version = "0.9.25", path = "../primalSpring/ecoPrimal" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async / GPU
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan", "vulkan-portability"] }
pollster = "0.4"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# CLI / errors
thiserror = "2.0.18"
clap = { version = "4", features = ["derive"] }

# Test deps
serial_test = "3"
proptest = "1"
