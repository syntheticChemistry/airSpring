[package]
name = "airspring-barracuda"
version = "0.10.0"
edition = "2024"
autobins = false
# MSRV 1.92: required for Edition 2024 `#[expect()]` with `reason`, `gen` keyword
# avoidance, and improved const-eval. Intentionally stricter than the ecosystem
# floor (1.87) — airSpring uses #[expect()] pervasively (100+ sites) and
# benefits from 1.92 diagnostics for unused expects.
rust-version = "1.92"
authors = ["Squirrel Team"]
license = "AGPL-3.0-or-later"
description = "Ecological & agricultural science pipelines — Rust + GPU + NPU via BarraCuda"

[workspace]

[features]
default = []
testutil = ["local"]
# Direct barraCuda library linkage (CPU math + GPU). Disable for pure IPC-only binary.
# Tier 4 IPC-first: not in default. Opt in with: cargo build --features local
local = ["dep:barracuda", "dep:wgpu"]
gpu = ["local"]
npu = ["dep:akida-driver"]
guidestone = ["dep:primalspring"]
primal-proof = []

[dependencies]
# BarraCuda 0.3.13: standalone sovereign math engine (ecoPrimals/barraCuda).
# Extracted from ToadStool S89 — universal math, precision per hardware.
# v0.3.13: wgpu 28, DF64 precision tier, linalg module, MethodGate pattern,
# MLP training, Nautilus server sessions, GPU pooling resilience.
# airSpring validates that Rust baselines can be faithfully ported to
# BarraCuda shaders. Used for stats, validation, GPU ops, and PDE primitives.
barracuda = { version = "0.3.13", path = "../../../primals/barraCuda/crates/barracuda", default-features = false, features = ["gpu", "domain-pde", "domain-genomics"], optional = true }

# JSON parsing: loads benchmark JSON files (control/fao56/*.json, etc.)
# with full provenance for validation fidelity.
# serde derive feature unused — only serde_json::Value API needed.
# Pure Rust (no C deps) — sovereign-compatible.
serde_json = "1"
toml = "0.8"

# Structured logging for library diagnostics (CSV parse warnings, etc.).
tracing = "0.1"

# Tracing subscriber: ValidationHarness (upstream S68+) uses tracing::info!.
# We init a simple fmt subscriber so harness output is visible.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Nautilus Shell: evolutionary reservoir computing via BingoCube board populations.
# Domain-agnostic feed-forward reservoir — no temporal recurrence needed.
# Provides DriftMonitor, EdgeSeeder, NautilusShell, and NautilusBrain APIs.
bingocube-nautilus = { version = "0.1.0", path = "../../primalTools/bingoCube/nautilus", features = ["json"] }

# Serde: needed for Nautilus brain serialization (observations, shell state).
serde = { version = "1", features = ["derive"] }

# wgpu 28 — matches barraCuda 0.3.7's pinned version for type compatibility.
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan", "vulkan-portability"], optional = true }

# BrainChip AKD1000 NPU driver — pure Rust, optional.
akida-driver = { path = "../../../primals/toadStool/crates/neuromorphic/akida-driver", optional = true }
thiserror = "2.0.18"
clap = { version = "4", features = ["derive"] }

# primalSpring composition context — feature-gated for guidestone L3+.
# Provides CompositionContext, discover_by_capability(), validate_liveness().
# Not a default dep — only needed when validating against live NUCLEUS.
primalspring = { version = "0.9.25", path = "../../primalSpring/ecoPrimal", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Library code uses #![deny()] in lib.rs and delegates casts to the cast module.
# Validation binaries use per-file #[expect(clippy::cast_*)] with reasons (wetSpring V132).

[dev-dependencies]
# Serial test execution for env-var tests (biomeos) to avoid race conditions.
serial_test = "3"
# Property-based testing for scientific invariants.
proptest = "1"

