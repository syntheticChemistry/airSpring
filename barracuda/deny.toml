# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny configuration for airspring-barracuda
# Run: cargo deny check (requires cargo install cargo-deny)
#
# Mirrors metalForge/forge/deny.toml — ecoBin v3.0 compliance.
# Zero C dependencies in application code.

[graph]
targets = []
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"

[licenses]
allow = [
    "AGPL-3.0",
    "AGPL-3.0+",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # ecoBin: no C/system dependencies in application code.
    # Cross-compilation and reproducibility require pure Rust.
    { crate = "openssl-sys", wrappers = [] },
    { crate = "libz-sys", wrappers = [] },
    { crate = "ring", wrappers = [] },
    { crate = "native-tls", wrappers = [] },
    { crate = "cmake", wrappers = [] },
    { crate = "cc", wrappers = [] },
    { crate = "bindgen", wrappers = [] },
    { crate = "pkg-config", wrappers = [] },
    { crate = "vcpkg", wrappers = [] },
    { crate = "libssh2-sys", wrappers = [] },
    { crate = "libgit2-sys", wrappers = [] },
    { crate = "curl-sys", wrappers = [] },
    { crate = "zstd-sys", wrappers = [] },
    { crate = "bzip2-sys", wrappers = [] },
    { crate = "lzma-sys", wrappers = [] },
    { crate = "sysinfo", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
