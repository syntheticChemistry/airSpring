# Superseded for CI: effective cargo-deny configuration lives next to each crate
# (e.g. barracuda/deny.toml, metalForge/forge when wired). This file is kept for
# reference; CI runs per-crate deny checks, not this root file.
#
# SPDX-License-Identifier: AGPL-3.0-or-later
# Workspace-level cargo-deny configuration for airSpring.
# Applies to barracuda/ and metalForge/forge/ crates.
# Run: cargo deny check (from repo root, requires cargo install cargo-deny)

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
