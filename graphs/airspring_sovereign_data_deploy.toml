# SPDX-License-Identifier: AGPL-3.0-or-later
#
# airSpring Deploy Graph — Sovereign Data Pipeline
#
# NestGate-mediated data flow for all external sources: Open-Meteo weather,
# USDA NASS crop yields, NCBI 16S genomic data. Content-addressed caching
# and audit logging through the sovereign data governance stack.
#
# This graph is the production-grade replacement for direct HTTP calls.
# When NestGate is live, all airSpring data flows route through it.
#
# Usage: biomeos deploy --graph graphs/airspring_sovereign_data_deploy.toml

[graph]
name = "airspring_sovereign_data_deploy"
description = "Sovereign data pipeline: NestGate-mediated weather, yield, and genomic data flow"
version = "0.10.0"
coordination = "sequential"

[graph.metadata]
security_model = "btsp_enforced"
transport = "uds_only"
tcp_ports = 0
owner = "airSpring"
pattern = "deploy"
proto_nucleate = "primalSpring/graphs/downstream/downstream_manifest.toml"
science_domain = "ecology_data"
composition_model = "nucleated"
fragments = ["tower_atomic", "data_layer"]

[graph.bonding_policy]
bond_type = "Metallic"
trust_model = "InternalNucleus"
tower_internal = "covalent"
nucleus_internal = "weak"
encryption_tiers.tower = "full"

# Tower Atomic
[[graph.nodes]]
name = "beardog"
binary = "beardog"
order = 1
required = true
spawn = false
health_method = "health.liveness"
by_capability = "security"

[[graph.nodes]]
name = "songbird"
binary = "songbird"
order = 2
required = true
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "discovery"

# Data gateway (sovereign routing, content-addressed cache)
[[graph.nodes]]
name = "nestgate"
binary = "nestgate"
order = 3
required = true
spawn = false
depends_on = ["beardog", "songbird"]
health_method = "health.liveness"
by_capability = "storage"

# Defense / Audit
[[graph.nodes]]
name = "skunkbat"
binary = "skunkbat"
order = 4
required = false
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "defense"

# Provenance (optional — graceful degradation)
[[graph.nodes]]
name = "sweetgrass"
binary = "sweetgrass"
order = 5
required = false
spawn = false
depends_on = ["beardog"]
health_method = "health.liveness"
by_capability = "provenance"

# airSpring application (data consumer)
[[graph.nodes]]
name = "airspring"
binary = "airspring_primal"
order = 6
required = true
spawn = true
depends_on = ["beardog", "songbird", "nestgate"]
health_method = "health.liveness"
by_capability = "ecology"
capabilities = [
    "data.weather",
    "data.cross_spring_weather",
    "science.et0_fao56",
    "ecology.water_balance",
    "health.liveness",
    "health.readiness",
    "capability.list",
]
