# SPDX-License-Identifier: AGPL-3.0-or-later
# airSpring capability registry — biomeOS ecology / agriculture science primal.
#
# Declares the capabilities this niche registers with Songbird for
# capability-based discovery. Self-knowledge only: no references to
# other primals' capabilities.
#
# Canonical source: niche.rs CAPABILITIES array.
# CI sync: tests/capabilities_match_registry.rs checks this file
# matches the Rust constant exactly.

[primal]
name = "airspring"
version = "0.10.0"
domain = "ecology"
license = "AGPL-3.0-or-later"
description = "Ecological & agricultural science pipelines — ET₀, irrigation, soil physics, crop yield via barraCuda"

# ── Evapotranspiration (7 methods) ──

[capabilities.et0_fao56]
method = "science.et0_fao56"
domain = "ecology.evapotranspiration"
description = "FAO-56 Penman-Monteith reference evapotranspiration (Allen et al. 1998)"
gpu_accelerated = true

[capabilities.et0_hargreaves]
method = "science.et0_hargreaves"
domain = "ecology.evapotranspiration"
description = "Hargreaves-Samani temperature-based ET₀ (1985)"
gpu_accelerated = true

[capabilities.et0_priestley_taylor]
method = "science.et0_priestley_taylor"
domain = "ecology.evapotranspiration"
description = "Priestley-Taylor radiation-based ET₀ (1972)"
gpu_accelerated = false

[capabilities.et0_makkink]
method = "science.et0_makkink"
domain = "ecology.evapotranspiration"
description = "Makkink radiation-based ET₀ (1957)"
gpu_accelerated = false

[capabilities.et0_turc]
method = "science.et0_turc"
domain = "ecology.evapotranspiration"
description = "Turc temperature-radiation ET₀ (1961)"
gpu_accelerated = false

[capabilities.et0_hamon]
method = "science.et0_hamon"
domain = "ecology.evapotranspiration"
description = "Hamon temperature-based PET (1961)"
gpu_accelerated = false

[capabilities.et0_blaney_criddle]
method = "science.et0_blaney_criddle"
domain = "ecology.evapotranspiration"
description = "Blaney-Criddle temperature-based PET (1950)"
gpu_accelerated = false

