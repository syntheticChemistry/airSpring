# SPDX-License-Identifier: AGPL-3.0-or-later
#
# biomeOS deployment graph: airSpring ecology primal atop Node Atomic.
#
# Sequence: BearDog → Songbird → ToadStool → airSpring
# This graph extends tower_atomic_bootstrap with compute (ToadStool)
# and the airSpring ecology/agriculture science pipeline.
#
# Usage:
#   biomeos deploy --graph metalForge/deploy/airspring_deploy.toml

[graph]
name = "airspring_ecology"
description = "airSpring ecology pipeline on Node Atomic (Tower + ToadStool + Provenance Trio + airSpring)"
version = "0.10.0"

# ── Node 1: BearDog (crypto + key management) ─────────────────────
[[graph.node]]
name = "beardog"
binary = "beardog_primal"
order = 1
required = true
health_method = "health"
capabilities = [
    "crypto.sign",
    "crypto.verify",
    "crypto.encrypt",
    "crypto.keygen",
]

# ── Node 2: Songbird (network + sovereign TLS 1.3) ────────────────
[[graph.node]]
name = "songbird"
binary = "songbird_primal"
order = 2
required = true
depends_on = ["beardog"]
health_method = "health"
capabilities = [
    "network.tls_connect",
    "network.http_fetch",
    "network.dns_resolve",
]

# ── Node 3: rhizoCrypt (ephemeral DAG sessions — provenance) ──────
[[graph.node]]
name = "rhizocrypt"
binary = "rhizocrypt_primal"
order = 3
required = false
depends_on = ["beardog"]
health_method = "dag.health"
by_capability = "dag"
capabilities = [
    "dag.create_session",
    "dag.append_event",
    "dag.dehydration.trigger",
]

# ── Node 4: loamSpine (immutable ledger — provenance) ─────────────
[[graph.node]]
name = "loamspine"
binary = "loamspine_primal"
order = 4
required = false
depends_on = ["beardog", "rhizocrypt"]
health_method = "commit.health"
by_capability = "commit"
capabilities = [
    "commit.session",
]

# ── Node 5: sweetGrass (semantic braids — provenance) ─────────────
[[graph.node]]
name = "sweetgrass"
binary = "sweetgrass_primal"
order = 5
required = false
depends_on = ["beardog", "loamspine"]
health_method = "provenance.health"
by_capability = "provenance"
capabilities = [
    "provenance.create_braid",
    "provenance.lineage",
]

# ── Node 6: ToadStool (GPU/CPU compute dispatch) ──────────────────
[[graph.node]]
name = "toadstool"
binary = "toadstool_primal"
order = 6
required = false
depends_on = ["beardog", "songbird"]
health_method = "compute.health"
capabilities = [
    "compute.health",
    "compute.version",
    "compute.execute",
    "compute.batch",
    "compute.precision_probe",
]

[graph.node.env]
TOADSTOOL_PRECISION = "auto"
TOADSTOOL_MULTI_DEVICE = "true"

# ── Node 7: airSpring (ecology + agriculture science) ──────────────
[[graph.node]]
name = "airspring"
binary = "airspring_primal"
order = 7
required = true
depends_on = ["beardog", "songbird"]
health_method = "health.liveness"
by_capability = "ecology"
capabilities = [
    # ET₀ methods
    "science.et0_fao56",
    "science.et0_hargreaves",
    "science.et0_priestley_taylor",
    "science.et0_makkink",
    "science.et0_turc",
    "science.et0_hamon",
    "science.et0_blaney_criddle",
    "science.thornthwaite",
    # Water balance & yield
    "science.water_balance",
    "science.yield_response",
    # Soil physics
    "science.richards_1d",
    "science.scs_cn_runoff",
    "science.green_ampt_infiltration",
    "science.soil_moisture_topp",
    "science.pedotransfer_saxton_rawls",
    # Crop & irrigation
    "science.dual_kc",
    "science.sensor_calibration",
    "science.gdd",
    # Biodiversity
    "science.shannon_diversity",
    "science.bray_curtis",
    # Geophysics
    "science.anderson_coupling",
    # Stochastic / drought
    "science.spi_drought_index",
    "science.autocorrelation",
    "science.gamma_cdf",
    # Ecology aliases
    "ecology.et0_fao56",
    "ecology.et0_hargreaves",
    "ecology.water_balance",
    "ecology.yield_response",
    "ecology.full_pipeline",
    "ecology.spi_drought_index",
    "ecology.autocorrelation",
    # Provenance trio
    "provenance.begin",
    "provenance.record",
    "provenance.complete",
    "provenance.status",
    # Cross-spring & coordination
    "science.timeseries",
    "capability.list",
    "data.cross_spring_weather",
    "science.version",
    "health.liveness",
    "health.readiness",
    "compute.offload",
    "data.weather",
    "primal.forward",
    "primal.discover",
]

[graph.node.env]
AIRSPRING_FAMILY_ID = "8ff3b864a4bc589a"
